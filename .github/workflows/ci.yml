name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install XSD validator
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils fonts-dejavu-core
      - run: npm ci
      - run: npm test
      - run: npm run test:xsd
      - run: npm run pdf:example

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t guesty-mydata-bridge:ci .
