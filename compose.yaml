name: guesty-mydata-bridge

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: guesty-mydata-bridge:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      DB_CLIENT: pg
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_PRIVATE_NETWORK: "true"
      MYDATA_ENV: ${MYDATA_ENV:-sandbox}
      MYDATA_TIMEOUT_MS: ${MYDATA_TIMEOUT_MS:-15000}
      MYDATA_PRODUCTION_ENABLED: ${MYDATA_PRODUCTION_ENABLED:-false}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?ADMIN_API_TOKEN is required}
      POLICY_ACCOUNTING_APPROVER_TOKEN: ${POLICY_ACCOUNTING_APPROVER_TOKEN:?POLICY_ACCOUNTING_APPROVER_TOKEN is required}
      POLICY_ACCOUNTING_ACTOR: ${POLICY_ACCOUNTING_ACTOR:?POLICY_ACCOUNTING_ACTOR is required}
      POLICY_TECHNICAL_APPROVER_TOKEN: ${POLICY_TECHNICAL_APPROVER_TOKEN:?POLICY_TECHNICAL_APPROVER_TOKEN is required}
      POLICY_TECHNICAL_ACTOR: ${POLICY_TECHNICAL_ACTOR:?POLICY_TECHNICAL_ACTOR is required}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?DATA_ENCRYPTION_KEY is required}
      DATA_ENCRYPTION_KEY_PREVIOUS: ${DATA_ENCRYPTION_KEY_PREVIOUS:-}
      GUESTY_CLIENT_ID: ${GUESTY_CLIENT_ID:?GUESTY_CLIENT_ID is required}
      GUESTY_CLIENT_SECRET: ${GUESTY_CLIENT_SECRET:?GUESTY_CLIENT_SECRET is required}
      GUESTY_WEBHOOK_SECRET: ${GUESTY_WEBHOOK_SECRET:?GUESTY_WEBHOOK_SECRET is required}
      GUESTY_ACCOUNT_ID: ${GUESTY_ACCOUNT_ID:?GUESTY_ACCOUNT_ID is required}
      DAILY_CLOSE_ENABLED: ${DAILY_CLOSE_ENABLED:-false}
      DAILY_CLOSE_TIME: ${DAILY_CLOSE_TIME:-23:55}
      DAILY_CLOSE_TIMEZONE: ${DAILY_CLOSE_TIMEZONE:-Europe/Athens}
      DAILY_CLOSE_LEASE_SECONDS: ${DAILY_CLOSE_LEASE_SECONDS:-300}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:3001/health/ready"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - backend

  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres-data:
